<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css" />
        <title>Calculator Project</title>
    </head>
    <body>
        <div class="center-text">
            <h2>Welcome to the Calculator</h2>
        </div>
        <div id="final-display">
            <!--<input type="number"/> -->
        </div>
        <div class="calculate">
            <div class="numbers boxs">
                <button class="nums box" id="num-one">1</button>
                <button class="nums box" id="num-two">2</button>
                <button class="nums box" id="num-three">3</button>
                <button class="nums box" id="num-four">4</button>
                <button class="nums box" id="num-five">5</button>
                <button class="nums box" id="num-six">6</button>
                <button class="nums box" id="num-seven">7</button>
                <button class="nums box" id="num-eight">8</button>
                <button class="nums box" id="num-nine">9</button>
                <button class="nums box" id="num-zero">0</button>
            </div>
            <div class="operation-symbol boxs">
                <button class="symbol box">+</button>
                <button class="symbol box">-</button>
                <button class="symbol box">*</button>
                <button class="symbol box">/</button>
                <button class="symbol box">=</button>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
